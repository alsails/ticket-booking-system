openapi: 3.0.3
info:
  title: Ticket Platform - Order Service API
  version: 1.0.0
  description: |
    Публичный API составных заказов на билеты одного или нескольких независимых
    организаторов. Order Service оркестрирует Saga; не владеет наличием мест
    и не выполняет платёж самостоятельно. Один заказ может содержать 1..N позиций.
servers:
  - url: http://localhost:8080/api/v1
    description: для production требуется HTTPS
tags:
  - name: Catalog
    description: Справочные данные, полученные через API организаторов
  - name: Orders
    description: Создание и наблюдение за выполнением составного заказа
security:
  - bearerAuth: []
paths:
  /organizers:
    get:
      tags: [Catalog]
      operationId: listOrganizers
      summary: Получить зарегистрированных организаторов
      responses:
        '200':
          description: Организаторы, доступные для заказа
          content:
            application/json:
              schema:
                type: object
                required: [organizers]
                properties:
                  organizers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizerInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizers/{organizerId}/events:
    get:
      tags: [Catalog]
      operationId: listOrganizerEvents
      summary: Получить мероприятия организатора
      description: Справочный прокси-запрос; актуальная цена фиксируется только при бронировании.
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
      responses:
        '200':
          description: Мероприятия по данным организатора
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /organizers/{organizerId}/events/{eventId}:
    get:
      tags: [Catalog]
      operationId: getOrganizerEvent
      summary: Получить мероприятие и ориентировочные свободные места
      parameters:
        - $ref: '#/components/parameters/OrganizerId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Состояние на момент чтения, не гарантия наличия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Создать составной заказ и запустить Saga
      description: |
        Асинхронная обработка: ответ 202 не означает успешную покупку.
        Для одной пары organizer_id / event_id можно передать несколько seat_ids.
        Повтор с тем же Idempotency-Key и неизменным телом возвращает тот же order_id;
        повтор ключа с другим телом — 409. Одна и та же пара
        organizer_id / event_id / seat_id не может встречаться дважды в заказе.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            example:
              items:
                - organizer_id: organizer-1
                  event_id: concert-2027
                  seat_ids: [A12, A13]
                - organizer_id: organizer-2
                  event_id: workshop-42
                  seat_ids: [B01]
      responses:
        '202':
          description: Заказ принят; итог определяется GET /orders/{orderId}
          headers:
            Location:
              description: URL для получения статуса заказа
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Получить статус заказа и билеты после полного завершения
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Текущее состояние; до COMPLETED билеты не выдаются
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizerId:
      name: organizerId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID, постоянный для одной логической команды
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
  schemas:
    OrganizerInfo:
      type: object
      required: [organizer_id, name]
      properties:
        organizer_id: { type: string, example: organizer-1 }
        name: { type: string, example: Концертная площадка }
    EventSummary:
      type: object
      required: [organizer_id, event_id, title, starts_at, currency]
      properties:
        organizer_id: { type: string }
        event_id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        currency: { type: string, enum: [RUB] }
    Seat:
      type: object
      required: [seat_id, available, price_minor]
      properties:
        seat_id: { type: string, example: A12 }
        available: { type: boolean }
        price_minor:
          type: integer
          format: int64
          minimum: 0
          description: Цена в копейках; справочная до успешного резерва
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [seats]
          properties:
            seats:
              type: array
              items: { $ref: '#/components/schemas/Seat' }
    OrderItemRequest:
      type: object
      additionalProperties: false
      required: [organizer_id, event_id, seat_ids]
      properties:
        organizer_id: { type: string, minLength: 1 }
        event_id: { type: string, minLength: 1 }
        seat_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemRequest' }
    OrderStatus:
      type: string
      description: |
        CREATED/RESERVING/PAYMENT_PENDING/CONFIRMING — Saga в работе;
        COMPLETED — получены все билеты;
        COMPENSATING — требуются отмены, аннулирования и/или возврат;
        CANCELLED — все требуемые компенсации подтверждены;
        MANUAL_REVIEW — автоматическое урегулирование пока не удалось, не означает отмену.
      enum: [CREATED, RESERVING, PAYMENT_PENDING, CONFIRMING, COMPLETED, COMPENSATING, CANCELLED, MANUAL_REVIEW]
    OrderItem:
      type: object
      required: [organizer_id, event_id, seat_id]
      properties:
        organizer_id: { type: string }
        event_id: { type: string }
        seat_id: { type: string }
        confirmed_ticket_id:
          type: string
          nullable: true
          description: Выдаётся покупателю только в COMPLETED
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [RUB] }
    Order:
      type: object
      required: [order_id, status, items, created_at, updated_at]
      properties:
        order_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        total:
          description: Поле отсутствует до резервирования всех позиций; затем содержит зафиксированную сумму
          allOf:
            - $ref: '#/components/schemas/Money'
        failure_code:
          type: string
          nullable: true
          description: Причина невозможности завершить покупку (если применимо)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string, example: DUPLICATE_SEAT }
        message: { type: string }
        retryable: { type: boolean }
        correlation_id: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Ключ идемпотентности использован с другим телом или конфликт состояния
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Повтор seat_id в составе заказа или недопустимая комбинация полей
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Внешний организатор временно недоступен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
