openapi: 3.0.3
info:
  title: Independent Organizer - Booking API
  version: 1.0.0
  description: |
    Единый обязательный контракт для каждого независимого организатора (1..N).
    Экземпляры с разными базами реализуют один и тот же API и могут независимо
    продавать места через собственные каналы. Каждая локальная операция над
    несколькими местами атомарна в системе организатора; глобальной транзакции нет.
servers:
  - url: https://{organizerHost}/api/v1
    description: URL определяется реестром организаторов, не фиксируется в коде Saga
    variables:
      organizerHost:
        default: organizer.example.test
        description: Зарегистрированный хост конкретного организатора
tags:
  - name: Catalog
  - name: Reservations
  - name: Tickets
  - name: Recovery
security:
  - serviceBearer: []
paths:
  /events:
    get:
      tags: [Catalog]
      operationId: listEvents
      summary: Перечень мероприятий организатора
      responses:
        '200':
          description: Мероприятия
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /events/{eventId}:
    get:
      tags: [Catalog]
      operationId: getEvent
      summary: Справочная доступность мест и цены
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: Снимок; актуальный остаток определяется атомарным Reserve
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations:
    post:
      tags: [Reservations]
      operationId: reserveSeats
      summary: Атомарно зарезервировать один или несколько билетов у организатора
      description: |
        Если хотя бы одно место недоступно — не резервируется ни одно место
        из переданного набора. Конкуренция с собственными каналами продаж
        учитывается организатором в своей БД. Повторная команда с теми же
        operation_id и Idempotency-Key возвращает исходный результат.
        requested_hold_seconds — требуемая минимальная длительность удержания;
        организатор либо гарантирует её, либо возвращает отказ HOLD_UNSUPPORTED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
            example:
              operation_id: 8d6e0991-d029-4230-8f36-8075220de891
              order_id: 5dfc83b6-3859-4aa9-aa65-f868c7d2ca0f
              requested_hold_seconds: 900
              items:
                - event_id: concert-2027
                  seat_ids: [A12, A13]
      responses:
        '201':
          description: Создана временная бронь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '200':
          description: Повтор операции — исходная бронь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /reservations/{reservationId}:
    get:
      tags: [Reservations, Recovery]
      operationId: getReservation
      summary: Получить статус брони по идентификатору
      parameters: [{ $ref: '#/components/parameters/ReservationId' }]
      responses:
        '200':
          description: Текущее состояние брони и связанных билетов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations/{reservationId}/confirm:
    post:
      tags: [Reservations]
      operationId: confirmReservation
      summary: Подтвердить бронь и выпустить билеты
      description: |
        Успешно только для активного HELD до expires_at либо как безопасный
        повтор ранее подтверждённой операции. Выпущенные билеты платформенных
        заказов нельзя выдавать покупателю до COMPLETED всего заказа.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '200':
          description: Подтверждённая бронь с билетом для каждого места
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /reservations/{reservationId}/cancel:
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Освободить места по временной брони
      description: |
        Для HELD переводит бронь в CANCELLED, для EXPIRED возвращает
        подтверждённый итог EXPIRED; CONFIRMED требует аннулирования билетов.
        Повтор команды безвреден. Нельзя отменить продажу собственного канала.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '200':
          description: Места освобождены либо бронь ранее истекла
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /tickets/{ticketId}/revoke:
    post:
      tags: [Tickets]
      operationId: revokeTicket
      summary: Аннулировать подтверждённый, но не использованный билет
      description: |
        Аннулирование запрещает использование билета, освобождает право
        прохода и фиксируется у организатора. Для заказа с несколькими
        билетами оркестратор аннулирует каждый подтверждённый ticket_id.
        Если билет уже использован, возврат невозможен автоматически:
        409 TICKET_ALREADY_USED и эскалация MANUAL_REVIEW.
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '200':
          description: Билет аннулирован, повтор возвращает тот же результат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /operations/{operationId}:
    get:
      tags: [Recovery]
      operationId: getOrganizerOperation
      summary: Проверить результат любой ранее отправленной команды
      description: |
        Используется после таймаута любого POST; повторять команду с новым
        operation_id запрещено до установления результата прежней команды.
      parameters: [{ $ref: '#/components/parameters/OperationId' }]
      responses:
        '200':
          description: Итог команды, включая её ссылки на бронь и билеты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
  schemas:
    EventSummary:
      type: object
      required: [event_id, title, starts_at, currency]
      properties:
        event_id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        currency: { type: string, enum: [RUB] }
    Seat:
      type: object
      required: [seat_id, available, price_minor]
      properties:
        seat_id: { type: string }
        available: { type: boolean }
        price_minor: { type: integer, format: int64, minimum: 0 }
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          required: [seats]
          properties:
            seats:
              type: array
              items: { $ref: '#/components/schemas/Seat' }
    ReserveLine:
      type: object
      additionalProperties: false
      required: [event_id, seat_ids]
      properties:
        event_id: { type: string, minLength: 1 }
        seat_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [operation_id, order_id, requested_hold_seconds, items]
      properties:
        operation_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        requested_hold_seconds:
          type: integer
          minimum: 600
          maximum: 3600
          example: 900
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReserveLine' }
    OperationRequest:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id: { type: string, format: uuid }
    Ticket:
      type: object
      required: [ticket_id, event_id, seat_id, status]
      properties:
        ticket_id: { type: string, format: uuid }
        event_id: { type: string }
        seat_id: { type: string }
        status:
          type: string
          enum: [ISSUED, REVOKED, USED]
    ReservedSeat:
      type: object
      required: [event_id, seat_id, price_minor]
      properties:
        event_id: { type: string }
        seat_id: { type: string }
        price_minor: { type: integer, format: int64, minimum: 0 }
    Reservation:
      type: object
      required: [reservation_id, operation_id, order_id, status, expires_at, currency, total_minor, reserved_seats, tickets]
      properties:
        reservation_id: { type: string, format: uuid }
        operation_id:
          type: string
          format: uuid
          description: ID исходной операции Reserve (не последней команды)
        order_id: { type: string, format: uuid }
        status:
          type: string
          enum: [HELD, CONFIRMED, CANCELLED, EXPIRED, PARTIALLY_REVOKED, REVOKED]
        expires_at:
          type: string
          format: date-time
          description: Срок окончания временной брони до подтверждения
        currency: { type: string, enum: [RUB] }
        total_minor: { type: integer, format: int64, minimum: 0 }
        reserved_seats:
          type: array
          items: { $ref: '#/components/schemas/ReservedSeat' }
        tickets:
          type: array
          description: Пусто до CONFIRMED; подтверждённые билеты хранятся у организатора
          items: { $ref: '#/components/schemas/Ticket' }
    OperationStatus:
      type: object
      required: [operation_id, operation_type, status]
      properties:
        operation_id: { type: string, format: uuid }
        operation_type: { type: string, enum: [RESERVE, CONFIRM, CANCEL, REVOKE] }
        status: { type: string, enum: [IN_PROGRESS, SUCCEEDED, FAILED] }
        reservation_id: { type: string, format: uuid, nullable: true }
        ticket_id: { type: string, format: uuid, nullable: true }
        ticket_ids:
          type: array
          items: { type: string, format: uuid }
        failure_code: { type: string, nullable: true }
        retryable: { type: boolean }
    Problem:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: SEAT_UNAVAILABLE, HOLD_UNSUPPORTED, RESERVATION_EXPIRED, TICKET_ALREADY_USED и др.
        message: { type: string }
        retryable: { type: boolean }
        operation_id: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Некорректные параметры
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Ошибка межсервисной авторизации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Место занято, бронь истекла, билет использован или конфликт повторной команды
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Невалидная комбинация мест/мероприятий
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс или операция не найдены
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Организатор временно недоступен; исход операции может быть неизвестен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
